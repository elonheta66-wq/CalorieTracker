<!DOCTYPE html>
<html>
<head>
    <title>ALENA - Calorie AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url("{{ url_for('static', filename='2025_09_25_09_04_IMG_6980.JPG') }}") no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4); /* vetëm errësim */
    z-index: 0;
}

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 15px;
            opacity: 0.9;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff6a88, #ff99ac);
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        video {
            width: 100%;
            border-radius: 15px;
            margin-top: 10px;
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            background: rgba(255,255,255,0.25);
            padding: 12px;
            border-radius: 12px;
        }

        select {
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            width: 100%;
        }

        hr {
            border: 1px solid rgba(255,255,255,0.3);
            margin: 20px 0;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>✨ ALENA</h1>
    <p>AI që njeh ushqimin dhe llogarit kaloritë</p>

    <!-- Upload -->
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="food_image" accept="image/*">
        <button type="submit">📂 Analizo nga File</button>
    </form>

    <hr>

    <!-- Kamera -->
    <h3>📷 Kamera</h3>

    <select id="cameraSelect">
        <option value="environment">Back Camera</option>
        <option value="user">Front Camera</option>
    </select>

    <video id="video" autoplay></video>

    <button id="snap">📸 Bëj Foto</button>

    <form method="POST">
        <input type="hidden" name="food_image_camera" id="food_image_camera">
        <button type="submit">⚡ Analizo nga Kamera</button>
    </form>

    {% if result %}
        <div class="result">
            💖 {{ result }}
        </div>
    {% endif %}

</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    const snap = document.getElementById('snap');
    const input = document.getElementById('food_image_camera');
    const cameraSelect = document.getElementById('cameraSelect');

    let currentStream;

    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: cameraSelect.value }
        });

        currentStream = stream;
        video.srcObject = stream;
    }

    cameraSelect.addEventListener('change', startCamera);
    startCamera();

    snap.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        canvas.getContext('2d').drawImage(video, 0, 0);

        input.value = canvas.toDataURL('image/jpeg');

        alert("Foto u kap! Kliko ANALIZO.");
    });
</script>

</body>
</html>
