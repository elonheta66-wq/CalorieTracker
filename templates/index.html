<!DOCTYPE html>
<html>
<head>
    <title>Calorie AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff6a88, #ff99ac);
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
        }

        video {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 10px;
        }

        select {
            margin-top: 10px;
            padding: 8px;
            border-radius: 10px;
            border: none;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>🍔 Calorie AI</h1>
    <p>Bëj foto ushqimi dhe zbulo kaloritë</p>

    <!-- Upload -->
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="food_image" accept="image/*">
        <button type="submit">📂 Analizo nga File</button>
    </form>

    <hr>

    <!-- Kamera -->
    <h3>Kamera</h3>

    <select id="cameraSelect">
        <option value="environment">Back Camera</option>
        <option value="user">Front Camera</option>
    </select>

    <video id="video" autoplay></video>

    <button id="snap">📸 Bëj Foto</button>

    <form method="POST">
        <input type="hidden" name="food_image_camera" id="food_image_camera">
        <button type="submit">⚡ Analizo nga Kamera</button>
    </form>

    {% if result %}
        <div class="result">
            💖 {{ result }}
        </div>
    {% endif %}

</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    const snap = document.getElementById('snap');
    const input = document.getElementById('food_image_camera');
    const cameraSelect = document.getElementById('cameraSelect');

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: cameraSelect.value }
        });
        video.srcObject = stream;
    }

    cameraSelect.addEventListener('change', startCamera);
    startCamera();

    snap.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        input.value = canvas.toDataURL('image/jpeg');
        alert("Foto u kap! Kliko ANALIZO.");
    });
</script>

</body>
</html>
